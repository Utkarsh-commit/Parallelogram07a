<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>UPI email test</title>
<style>body{font-family:sans-serif;background:#111;color:#eee;padding:20px;max-width:480px;margin:auto}input,button{width:100%;padding:14px;margin:8px 0;font-size:16px;border-radius:8px;border:1px solid #444;background:#1c1c1c;color:#fff}button{background:#c9a24a;color:#000;font-weight:700}pre{white-space:pre-wrap;background:#000;padding:12px;border-radius:8px}</style></head><body>
<h3>UPI approval email test</h3>
<p>Type your own email. No payment is made.</p>
<input id="e" type="email" placeholder="your email">
<button onclick="go()">Send test</button>
<pre id="o">Waiting...</pre>
<script>
function go(){
  var o=document.getElementById('o');o.textContent='Sending...';
  fetch('/.netlify/functions/upi-claim',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:'Test',email:document.getElementById('e').value.trim(),titles:['Think Smarter: Mental Models That Win'],amount:249,utr:'123456789012',ref:'PGTEST'+Date.now().toString().slice(-6)})})
  .then(function(r){return r.text().then(function(t){o.textContent='HTTP '+r.status+'\n'+t;});})
  .catch(function(e){o.textContent='Network error: '+e;});
}
</script></body></html>
